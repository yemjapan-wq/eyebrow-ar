<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARCH AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,'Helvetica Neue',sans-serif; color:#fff; }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:200;
    background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition:opacity 0.8s ease;
  }
  #splash.hide { opacity:0; pointer-events:none; }
  .sp-eyebrow { font-size:9px; letter-spacing:6px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:20px; }
  .sp-logo { font-size:52px; font-weight:700; letter-spacing:-2px; color:#fff; margin-bottom:6px; }
  .sp-logo span { font-weight:200; }
  .sp-tagline { font-size:10px; letter-spacing:3px; color:rgba(255,255,255,0.25); margin-bottom:56px; }
  .sp-line { width:48px; height:1px; background:rgba(255,255,255,0.15); position:relative; overflow:hidden; }
  .sp-line::after {
    content:''; position:absolute; top:0; left:-100%;
    width:100%; height:100%; background:#fff;
    animation:scanline 1.8s ease forwards;
  }
  @keyframes scanline { to { left:100%; } }
  .sp-loading { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.2); margin-top:20px; }

  /* ── CAMERA ── */
  #app { position:fixed; inset:0; }
  #video {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scaleX(-1);
    min-width:100%; min-height:100%; width:auto; height:auto;
    filter:brightness(1.06) contrast(0.9) saturate(1.12) blur(0.3px);
  }
  #svg-overlay {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; transform:scaleX(-1);
    display:none;
  }
  #svg-overlay.show { display:block; }

  /* ── TOP BAR ── */
  #topbar {
    position:fixed; top:0; left:0; right:0;
    padding:54px 20px 16px;
    background:linear-gradient(to bottom,rgba(0,0,0,0.7) 0%,transparent 100%);
    display:flex; align-items:center; justify-content:space-between;
    z-index:10;
  }
  #status-wrap { display:flex; align-items:center; gap:8px; }
  #status-dot { width:6px; height:6px; border-radius:50%; background:#555; transition:background 0.3s; }
  #status-dot.on { background:#34C759; box-shadow:0 0 8px #34C759; }
  #status-text { font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.35); text-transform:uppercase; }
  #app-name { font-size:14px; font-weight:600; letter-spacing:3px; color:#fff; }

  /* ── GENDER TOGGLE ── */
  #gender-toggle {
    position:fixed; top:110px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:30px; padding:3px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .gender-btn {
    padding:8px 28px; font-size:11px; font-weight:500;
    letter-spacing:2px; cursor:pointer; border:none;
    background:none; color:rgba(255,255,255,0.4);
    border-radius:26px; transition:all 0.25s; text-transform:uppercase;
  }
  .gender-btn.active { background:#fff; color:#000; font-weight:600; }

  /* ── SCAN MODE BOTTOM ── */
  #bottom-scan {
    position:fixed; bottom:0; left:0; right:0;
    padding:20px 20px 50px;
    background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 100%);
    z-index:10;
  }
  .bottom-hint {
    text-align:center; font-size:10px; letter-spacing:2px;
    color:rgba(255,255,255,0.25); margin-bottom:16px;
    text-transform:uppercase;
  }
  #scan-btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%;
    background:#fff; color:#000; border:none;
    padding:17px; border-radius:14px;
    font-size:15px; font-weight:600; letter-spacing:1px;
    cursor:pointer; transition:all 0.2s;
  }
  #scan-btn:active { transform:scale(0.97); }
  #scan-btn:disabled { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.2); cursor:not-allowed; }
  #scan-btn:disabled:active { transform:none; }
  .scan-circle {
    width:18px; height:18px; border-radius:50%;
    border:2px solid currentColor; position:relative; flex-shrink:0;
  }
  .scan-circle::after {
    content:''; position:absolute; top:50%; left:50%;
    width:6px; height:6px; border-radius:50%;
    background:currentColor; transform:translate(-50%,-50%);
  }

  /* ── AR MODE BOTTOM ── */
  #bottom-ar {
    position:fixed; bottom:0; left:0; right:0;
    padding:0 0 44px;
    background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 100%);
    z-index:10; display:none;
  }
  #bottom-ar.show { display:block; }
  #ar-scene-label {
    text-align:center; font-size:9px; letter-spacing:3px;
    color:rgba(255,255,255,0.3); margin:16px 0 10px;
    text-transform:uppercase;
  }
  #ar-scene-name {
    text-align:center; font-size:13px; font-weight:500;
    color:rgba(255,255,255,0.8); margin-bottom:14px;
    letter-spacing:0.5px;
  }
  #scene-wrap {
    overflow-x:auto; display:flex; gap:8px;
    padding:0 20px 16px; scrollbar-width:none;
  }
  #scene-wrap::-webkit-scrollbar { display:none; }
  .scene-btn {
    flex-shrink:0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.6);
    padding:8px 16px; border-radius:30px;
    font-size:11px; cursor:pointer; white-space:nowrap;
    transition:all 0.2s; letter-spacing:0.5px;
  }
  .scene-btn.active { background:#fff; color:#000; font-weight:600; border-color:#fff; }
  #back-btn {
    display:flex; align-items:center; justify-content:center;
    width:calc(100% - 40px); margin:0 20px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.6); padding:14px;
    border-radius:14px; font-size:13px;
    cursor:pointer; letter-spacing:1px;
  }
  #adjust-wrap {
    display:flex; align-items:center; justify-content:center;
    gap:20px; padding:10px 20px 14px;
  }
  .adjust-col {
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .adjust-label {
    font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.3);
    text-transform:uppercase;
  }
  .adj-btn {
    width:44px; height:44px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff; border-radius:12px;
    font-size:18px; cursor:pointer;
    transition:all 0.15s; display:flex;
    align-items:center; justify-content:center;
  }
  .adj-btn:active { background:rgba(255,255,255,0.2); transform:scale(0.94); }
  #reset-btn {
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:rgba(255,255,255,0.35);
    padding:8px 16px; border-radius:20px;
    font-size:10px; letter-spacing:2px; cursor:pointer;
  }

  /* ── AR LEGEND ── */
  #ar-legend {
    position:fixed; top:60px; right:16px;
    z-index:10; display:none; flex-direction:column; gap:7px;
  }
  #ar-legend.show { display:flex; }
  .leg { display:flex; align-items:center; gap:6px; font-size:10px; color:rgba(255,255,255,0.6); }
  .leg-dot { width:8px; height:8px; border-radius:50%; }

  /* ── ANALYZING ── */
  #analyzing {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    z-index:60; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
  }
  #analyzing.show { display:flex; }
  .ana-ring {
    width:44px; height:44px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.1); border-top-color:#fff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ana-text { font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.4); }
  .ana-sub { font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.2); }

  /* ── RESULT PANEL ── */
  #result-panel {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.97);
    z-index:50; overflow-y:auto;
    padding:60px 20px 40px;
  }
  #result-panel.show { display:block; }

  .result-photo-wrap { display:flex; justify-content:center; margin-bottom:24px; }
  #result-photo {
    width:88px; height:88px; border-radius:50%;
    object-fit:cover; transform:scaleX(-1);
    border:1px solid rgba(255,255,255,0.12);
  }

  .result-header { text-align:center; margin-bottom:28px; }
  .result-eyebrow { font-size:9px; letter-spacing:4px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:8px; }
  .result-title { font-size:20px; font-weight:700; letter-spacing:-0.3px; }
  .result-divider { width:28px; height:1px; background:rgba(255,255,255,0.12); margin:14px auto 0; }

  /* 人相学カード */
  .physio-card {
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:16px; padding:20px; margin-bottom:12px;
  }
  .card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .card-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .card-label { font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.28); text-transform:uppercase; }
  .card-text { font-size:13px; color:rgba(255,255,255,0.82); line-height:1.9; font-weight:300; }

  /* 推奨シーンバッジ */
  .recommend-badge {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:30px; padding:8px 16px;
    font-size:12px; color:rgba(255,255,255,0.7);
    display:inline-block; margin-top:10px;
    letter-spacing:0.5px;
  }

  /* ARで確認ボタン */
  #ar-btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; margin-top:16px;
    background:#fff; color:#000; border:none;
    padding:17px; border-radius:14px;
    font-size:15px; font-weight:600; letter-spacing:1px;
    cursor:pointer; transition:all 0.2s;
  }
  #ar-btn:active { transform:scale(0.97); }

  #close-result-btn {
    display:flex; align-items:center; justify-content:center;
    width:100%; margin-top:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.4); padding:14px;
    border-radius:14px; font-size:13px;
    cursor:pointer; letter-spacing:1px;
  }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-eyebrow">AI Eyebrow Navigator</div>
  <div class="sp-logo">ARCH<span>AI</span></div>
  <div class="sp-tagline">人相学 × 眉毛AR診断</div>
  <div class="sp-line"></div>
  <div class="sp-loading">Loading...</div>
</div>

<!-- ANALYZING -->
<div id="analyzing">
  <div class="ana-ring"></div>
  <div class="ana-text">AI診断中</div>
  <div class="ana-sub">人相学 × 眉毛分析</div>
</div>

<!-- APP -->
<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>
  <svg id="svg-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg>

  <!-- TOP -->
  <div id="topbar">
    <div id="status-wrap">
      <div id="status-dot"></div>
      <div id="status-text">Searching</div>
    </div>
    <div id="app-name">ARCH AI</div>
    <div style="width:60px;"></div>
  </div>

  <!-- GENDER -->
  <div id="gender-toggle">
    <button class="gender-btn active" onclick="setGender('mens',this)">Mens</button>
    <button class="gender-btn" onclick="setGender('womens',this)">Womens</button>
  </div>

  <!-- AR LEGEND -->
  <div id="ar-legend">
    <div class="leg"><div class="leg-dot" style="background:#FF3B3B;"></div>削る</div>
    <div class="leg"><div class="leg-dot" style="background:#2E7CF6;"></div>残す</div>
  </div>

  <!-- SCAN MODE -->
  <div id="bottom-scan">
    <div class="bottom-hint">顔を画面に合わせてスキャン</div>
    <button id="scan-btn" onclick="startScan()" disabled>
      <div class="scan-circle"></div>
      人相学 × 眉毛診断
    </button>
  </div>

  <!-- AR MODE -->
  <div id="bottom-ar">
    <div id="ar-scene-label">AIが選んだ眉毛スタイル</div>
    <div id="ar-scene-name"></div>
    <div id="scene-wrap"></div>

    <!-- 左右独立調整ボタン -->
    <div id="adjust-wrap">
      <div class="adjust-col">
        <div class="adjust-label">右眉</div>
        <button class="adj-btn" onclick="adjustY('left',-3)">↑</button>
        <button class="adj-btn" onclick="adjustY('left',3)">↓</button>
      </div>
      <button id="reset-btn" onclick="resetY()">リセット</button>
      <div class="adjust-col">
        <div class="adjust-label">左眉</div>
        <button class="adj-btn" onclick="adjustY('right',-3)">↑</button>
        <button class="adj-btn" onclick="adjustY('right',3)">↓</button>
      </div>
    </div>

    <button id="back-btn" onclick="backToScan()">← 診断結果に戻る</button>
  </div>
</div>

<!-- RESULT -->
<div id="result-panel">
  <div class="result-photo-wrap">
    <img id="result-photo" src="" alt="">
  </div>
  <div class="result-header">
    <div class="result-eyebrow">Your Physiognomy Report</div>
    <div class="result-title">人相 × 眉毛診断レポート</div>
    <div class="result-divider"></div>
  </div>

  <div class="physio-card">
    <div class="card-header">
      <div class="card-dot" style="background:#A78BFA;"></div>
      <div class="card-label">あなたの人相</div>
    </div>
    <div class="card-text" id="r-physio"></div>
  </div>

  <div class="physio-card">
    <div class="card-header">
      <div class="card-dot" style="background:#FB923C;"></div>
      <div class="card-label">顔相の弱点</div>
    </div>
    <div class="card-text" id="r-weakness"></div>
  </div>

  <div class="physio-card">
    <div class="card-header">
      <div class="card-dot" style="background:#34D399;"></div>
      <div class="card-label">眉毛で補う方法</div>
    </div>
    <div class="card-text" id="r-rec"></div>
    <div class="recommend-badge" id="r-scene-badge"></div>
  </div>

  <div class="physio-card">
    <div class="card-header">
      <div class="card-dot" style="background:#FF3B3B;"></div>
      <div class="card-label">削る・整える場所</div>
    </div>
    <div class="card-text" id="r-trim"></div>
  </div>

  <div class="physio-card">
    <div class="card-header">
      <div class="card-dot" style="background:#2E7CF6;"></div>
      <div class="card-label">残す・描き足す場所</div>
    </div>
    <div class="card-text" id="r-keep"></div>
  </div>

  <button id="ar-btn" onclick="goToAR()">
    <div class="scan-circle"></div>
    ARで眉毛を確認する
  </button>
  <button id="close-result-btn" onclick="closeResult()">← やり直す</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const TEMPLATES = {
  'mens-business':  { label:'ビジネス眉',  path:'M 20,60 Q 150,48 280,35 L 380,50 Q 280,50 20,70 Z', red:'M 40,70 Q 160,60 260,50 Q 160,70 40,70 Z' },
  'mens-sexy':      { label:'モテ眉',      path:'M 20,60 Q 150,45 270,35 Q 320,35 380,60 Q 270,45 20,65 Z', red:'M 150,60 Q 250,50 300,55 Q 250,60 150,60 Z' },
  'mens-clean':     { label:'清潔感眉',    path:'M 20,55 L 20,40 L 280,40 L 380,55 L 280,55 Z', red:'M 30,60 Q 150,60 270,60 Q 150,65 30,60 Z' },
  'mens-strong':    { label:'強さ眉',      path:'M 20,70 L 20,40 Q 150,45 270,28 L 380,55 L 270,45 Q 150,60 20,70 Z', red:'M 30,75 Q 150,65 260,50 Q 150,75 30,75 Z' },
  'womens-business':{ label:'ハンサム眉',  path:'M 20,55 Q 150,45 270,30 L 380,50 Q 270,40 20,60 Z', red:'M 50,65 Q 150,55 250,45 Q 150,60 50,65 Z' },
  'womens-sexy':    { label:'エレガント眉', path:'M 20,65 Q 120,30 260,25 Q 330,30 380,65 Q 260,35 20,70 Z', red:'M 40,75 Q 150,45 260,45 Q 150,60 40,75 Z' },
  'womens-natural': { label:'ふんわり眉',  path:'M 20,60 Q 150,40 270,40 Q 320,45 380,65 Q 270,55 20,70 Z', red:'M 60,70 Q 180,55 280,60 Q 180,70 60,70 Z' },
  'womens-cute':    { label:'可愛い眉',    path:'M 20,65 L 20,45 Q 200,45 380,52 L 380,58 Q 200,60 20,65 Z', red:'M 30,68 Q 200,63 350,60 Q 200,70 30,68 Z' }
};
const SCENES_MENS   = ['mens-business','mens-sexy','mens-clean','mens-strong'];
const SCENES_WOMENS = ['womens-business','womens-sexy','womens-natural','womens-cute'];

const LEFT_EYEBROW  = [46,53,52,65,55,70,63,105,66,107];
const RIGHT_EYEBROW = [276,283,282,295,285,300,293,334,296,336];

let currentGender  = 'mens';
let currentScene   = 'mens-business';
let aiScene        = 'mens-business';
let faceMesh       = null;
let videoW = 640, videoH = 480;
let leftYOffset  = 0;  // 左眉の手動オフセット（px）
let rightYOffset = 0;  // 右眉の手動オフセット（px）

function adjustY(side, delta) {
  if (side === 'left')  leftYOffset  += delta;
  if (side === 'right') rightYOffset += delta;
}

function resetY() {
  leftYOffset = 0;
  rightYOffset = 0;
}

function setGender(g, btn) {
  currentGender = g;
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function drawSVG(landmarks) {
  const svg = document.getElementById('svg-overlay');
  svg.innerHTML = '';
  const tmpl = TEMPLATES[currentScene];
  if (!tmpl) return;

  // defs: フィルター（スクリーン座標系で適用）
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <filter id="f-blue" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="f-red" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <!-- 斜線パターン（削る＝設計図） -->
    <pattern id="hatch" x="0" y="0" width="8" height="8"
             patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8"
            stroke="#FF3B3B" stroke-width="2.5" stroke-opacity="0.85"/>
    </pattern>
  `;
  svg.appendChild(defs);

  [
    { indices: LEFT_EYEBROW,  flip: false, yOff: leftYOffset  },
    { indices: RIGHT_EYEBROW, flip: true,  yOff: rightYOffset }
  ].forEach(({ indices, flip, yOff }) => {
    const pts = indices.map(i => landmarks[i]);
    const xs = pts.map(p => p.x * videoW);
    const ys = pts.map(p => p.y * videoH);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const bW = maxX - minX;
    const cx = (minX + maxX) / 2;
    const cy = (Math.min(...ys) + Math.max(...ys)) / 2 - bW * 0.15 + yOff;
    const sx = bW / 360, sy = sx * 3;

    // transform文字列
    const tf = flip
      ? `translate(${cx+200*sx},${cy-50*sy}) scale(${-sx},${sy})`
      : `translate(${cx-200*sx},${cy-50*sy}) scale(${sx},${sy})`;

    // 青パス（残す）- ダークブラウン + darkenブレンド
    const blueWrap = document.createElementNS('http://www.w3.org/2000/svg','g');
    blueWrap.setAttribute('filter','url(#f-blue)');
    blueWrap.style.mixBlendMode = 'darken';
    const blueG = document.createElementNS('http://www.w3.org/2000/svg','g');
    blueG.setAttribute('transform', tf);
    const bp = document.createElementNS('http://www.w3.org/2000/svg','path');
    bp.setAttribute('d', tmpl.path);
    bp.setAttribute('fill','#3d2b1f');
    bp.setAttribute('fill-opacity','0.65');
    bp.setAttribute('stroke','#6b4c3b');
    bp.setAttribute('stroke-width','1.5');
    bp.setAttribute('stroke-opacity','0.5');
    blueG.appendChild(bp);
    blueWrap.appendChild(blueG);
    svg.appendChild(blueWrap);

    // 赤パス（削る）- 斜線パターン（設計図）
    const redWrap = document.createElementNS('http://www.w3.org/2000/svg','g');
    redWrap.setAttribute('filter','url(#f-red)');
    const redG = document.createElementNS('http://www.w3.org/2000/svg','g');
    redG.setAttribute('transform', tf);
    // 斜線塗り
    const rp = document.createElementNS('http://www.w3.org/2000/svg','path');
    rp.setAttribute('d', tmpl.red);
    rp.setAttribute('fill','url(#hatch)');
    rp.setAttribute('stroke','#FF3B3B');
    rp.setAttribute('stroke-width','2');
    rp.setAttribute('stroke-opacity','0.9');
    redG.appendChild(rp);
    redWrap.appendChild(redG);
    svg.appendChild(redWrap);
  });
}

async function startScan() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('capture-canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-canvas.width,0); ctx.restore();
  const b64 = canvas.toDataURL('image/jpeg',0.8).split(',')[1];
  document.getElementById('result-photo').src = canvas.toDataURL('image/jpeg',0.8);
  document.getElementById('analyzing').classList.add('show');

  try {
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imageBase64: b64, gender: currentGender === 'mens' ? '男性' : '女性' })
    });
    const result = await res.json();

    // 結果をセット
    document.getElementById('r-physio').textContent   = result.physiognomy || '';
    document.getElementById('r-weakness').textContent = result.weakness    || '';
    document.getElementById('r-rec').textContent      = result.recommendation || '';
    document.getElementById('r-trim').textContent     = result.trim        || '';
    document.getElementById('r-keep').textContent     = result.keep        || '';

    // AIが選んだシーン
    aiScene = result.scene || (currentGender === 'mens' ? 'mens-business' : 'womens-business');
    if (!TEMPLATES[aiScene]) aiScene = currentGender === 'mens' ? 'mens-business' : 'womens-business';
    document.getElementById('r-scene-badge').textContent = '✨ ' + TEMPLATES[aiScene].label + ' を推奨';

    document.getElementById('analyzing').classList.remove('show');
    document.getElementById('result-panel').classList.add('show');

  } catch(e) {
    document.getElementById('analyzing').classList.remove('show');
    alert('診断に失敗しました。再度お試しください。');
    console.error(e);
  }
}

function goToAR() {
  document.getElementById('result-panel').classList.remove('show');
  currentScene = aiScene;

  // ARモードに切替
  document.getElementById('bottom-scan').style.display = 'none';
  document.getElementById('bottom-ar').classList.add('show');
  document.getElementById('svg-overlay').classList.add('show');
  document.getElementById('ar-legend').classList.add('show');
  document.getElementById('gender-toggle').style.display = 'none';
  document.getElementById('ar-scene-name').textContent = TEMPLATES[aiScene].label;

  renderARScenes();
}

function renderARScenes() {
  const wrap = document.getElementById('scene-wrap');
  wrap.innerHTML = '';
  const scenes = currentGender === 'mens' ? SCENES_MENS : SCENES_WOMENS;
  scenes.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn' + (id === currentScene ? ' active' : '');
    btn.textContent = TEMPLATES[id].label;
    btn.onclick = () => {
      currentScene = id;
      document.getElementById('ar-scene-name').textContent = TEMPLATES[id].label;
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    wrap.appendChild(btn);
  });
}

function backToScan() {
  document.getElementById('bottom-scan').style.display = 'block';
  document.getElementById('bottom-ar').classList.remove('show');
  document.getElementById('svg-overlay').classList.remove('show');
  document.getElementById('ar-legend').classList.remove('show');
  document.getElementById('gender-toggle').style.display = 'flex';
  document.getElementById('result-panel').classList.add('show');
}

function closeResult() {
  document.getElementById('result-panel').classList.remove('show');
}

async function initFaceMesh() {
  faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
  faceMesh.onResults(results => {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    const btn = document.getElementById('scan-btn');
    if (results.multiFaceLandmarks?.length > 0) {
      dot.classList.add('on'); txt.textContent = 'Detecting'; btn.disabled = false;
      if (document.getElementById('svg-overlay').classList.contains('show')) drawSVG(results.multiFaceLandmarks[0]);
    } else {
      dot.classList.remove('on'); txt.textContent = 'Searching'; btn.disabled = true;
      document.getElementById('svg-overlay').innerHTML = '';
    }
  });
}

async function startCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    videoW = video.videoWidth || 640; videoH = video.videoHeight || 480;
    document.getElementById('svg-overlay').setAttribute('viewBox', `0 0 ${videoW} ${videoH}`);
    const camera = new Camera(video, { onFrame: async () => { if (faceMesh) await faceMesh.send({ image: video }); } });
    camera.start();
    setTimeout(() => document.getElementById('splash').classList.add('hide'), 2200);
  } catch(e) {
    document.querySelector('.sp-loading').textContent = 'カメラの許可をしてください';
  }
}

window.addEventListener('load', async () => {
  await initFaceMesh();
  await startCamera();
});
</script>
