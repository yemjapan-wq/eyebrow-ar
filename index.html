<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>眉毛ARナビ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', sans-serif; }
  #camera-wrap { position: fixed; inset: 0; }
  #video {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scaleX(-1);
    min-width: 100%; min-height: 100%; width: auto; height: auto;
    filter: brightness(1.08) contrast(0.88) saturate(1.15) blur(0.4px);
  }
  #svg-overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; transform: scaleX(-1);
  }
  #status {
    position: fixed; top: 16px; left: 16px;
    font-size: 10px; letter-spacing: 2px; color: #ffffff55;
    z-index: 10; text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #status.detecting { color: #2ecc71; }
  #status.searching { color: #e67e22; }
  #gender-toggle {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 22px; overflow: hidden;
  }
  .gender-btn {
    padding: 8px 22px; font-size: 11px; letter-spacing: 2px;
    cursor: pointer; color: #ffffff66;
    transition: all 0.2s; border: none; background: none;
  }
  .gender-btn.active { background: #fff; color: #000; font-weight: 700; }
  #legend {
    position: fixed; top: 60px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 7px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; }
  #ui {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 16px 20px 36px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    z-index: 10;
  }
  #scene-label {
    text-align: center; font-size: 10px; letter-spacing: 3px;
    color: #ffffff44; text-transform: uppercase; margin-bottom: 10px;
  }
  #scene-list {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  .scene-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s; letter-spacing: 1px;
  }
  .scene-btn.active { background: #fff; color: #000; font-weight: 700; }
  #scan-btn {
    display: block; width: 100%;
    background: linear-gradient(135deg, #e74c3c, #2980b9);
    border: none; color: #fff; padding: 14px; border-radius: 12px;
    font-size: 14px; font-weight: 700; letter-spacing: 3px;
    cursor: pointer; transition: opacity 0.2s; text-transform: uppercase;
  }
  #scan-btn:active { opacity: 0.7; }
  #scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #result-panel {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.93); z-index: 50;
    flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 50px 24px 40px;
    overflow-y: auto;
  }
  #result-panel.show { display: flex; }
  #result-photo {
    width: 140px; height: 140px; border-radius: 50%;
    object-fit: cover; border: 3px solid rgba(255,255,255,0.2);
    margin-bottom: 20px; transform: scaleX(-1);
  }
  #result-scene-badge {
    font-size: 9pt; letter-spacing: 4px;
    color: #e74c3c; text-transform: uppercase; margin-bottom: 8px;
  }
  #result-title {
    font-size: 20px; font-weight: 900; color: #fff;
    letter-spacing: 2px; margin-bottom: 24px; text-align: center;
  }
  .result-section {
    width: 100%; background: rgba(255,255,255,0.06);
    border-radius: 12px; padding: 18px; margin-bottom: 14px;
    border-left: 3px solid;
  }
  .result-section.red  { border-left-color: #e74c3c; }
  .result-section.blue { border-left-color: #3498db; }
  .result-section.gold { border-left-color: #f39c12; }
  .result-section-label {
    font-size: 8px; letter-spacing: 3px; color: #ffffff55;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .result-section-text { font-size: 13px; color: #ffffffdd; line-height: 1.8; }
  #close-btn {
    margin-top: 10px; width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 14px; border-radius: 12px;
    font-size: 13px; cursor: pointer; letter-spacing: 2px;
  }
  #loading {
    position: fixed; inset: 0; background: #0a0a0f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; gap: 16px;
  }
  #loading-title { font-size: 18px; font-weight: 700; letter-spacing: 4px; color: #fff; }
  #loading-sub { font-size: 11px; color: #ffffff44; letter-spacing: 3px; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid #ffffff11; border-top-color: #fff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #analyzing {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 60;
    flex-direction: column; align-items: center;
    justify-content: center; gap: 16px;
  }
  #analyzing.show { display: flex; }
  #analyzing p { font-size: 12px; color: #fff; letter-spacing: 3px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-title">EYEBROW AR</div>
  <div id="loading-sub">AI読み込み中...</div>
</div>

<div id="analyzing">
  <div class="spinner"></div>
  <p>AI診断中...</p>
</div>

<div id="camera-wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>
  <svg id="svg-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg>

  <div id="status" class="searching">● SEARCHING</div>
  <div id="gender-toggle">
    <button class="gender-btn active" onclick="setGender('mens',this)">MENS</button>
    <button class="gender-btn" onclick="setGender('womens',this)">WOMENS</button>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FF3333;"></div>削る</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0055FF;"></div>残す</div>
  </div>
  <div id="ui">
    <div id="scene-label">— シーンを選択 —</div>
    <div id="scene-list"></div>
    <button id="scan-btn" onclick="startScan()" disabled>● AI診断する</button>
  </div>
</div>

<div id="result-panel">
  <img id="result-photo" src="" alt="">
  <div id="result-scene-badge"></div>
  <div id="result-title">AI眉毛診断レポート</div>
  <div class="result-section red">
    <div class="result-section-label">🔴 削る・整える場所</div>
    <div class="result-section-text" id="r-trim"></div>
  </div>
  <div class="result-section blue">
    <div class="result-section-label">🔵 残す・描き足す場所</div>
    <div class="result-section-text" id="r-keep"></div>
  </div>
  <div class="result-section gold">
    <div class="result-section-label">✨ AIからのアドバイス</div>
    <div class="result-section-text" id="r-advice"></div>
  </div>
  <button id="close-btn" onclick="closeResult()">← カメラに戻る</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const TEMPLATES = {
  'mens-business':  { label:'ビジネス', path:'M 20,60 Q 150,48 280,35 L 380,50 Q 280,50 20,70 Z', red:'M 40,70 Q 160,60 260,50 Q 160,70 40,70 Z' },
  'mens-sexy':      { label:'モテる',   path:'M 20,60 Q 150,45 270,35 Q 320,35 380,60 Q 270,45 20,65 Z', red:'M 150,60 Q 250,50 300,55 Q 250,60 150,60 Z' },
  'mens-clean':     { label:'清潔',     path:'M 20,55 L 20,40 L 280,40 L 380,55 L 280,55 Z', red:'M 30,60 Q 150,60 270,60 Q 150,65 30,60 Z' },
  'mens-strong':    { label:'強さ',     path:'M 20,70 L 20,40 Q 150,45 270,28 L 380,55 L 270,45 Q 150,60 20,70 Z', red:'M 30,75 Q 150,65 260,50 Q 150,75 30,75 Z' },
  'womens-business':{ label:'ビジネス', path:'M 20,55 Q 150,45 270,30 L 380,50 Q 270,40 20,60 Z', red:'M 50,65 Q 150,55 250,45 Q 150,60 50,65 Z' },
  'womens-sexy':    { label:'モテる',   path:'M 20,65 Q 120,30 260,25 Q 330,30 380,65 Q 260,35 20,70 Z', red:'M 40,75 Q 150,45 260,45 Q 150,60 40,75 Z' },
  'womens-natural': { label:'優しさ',   path:'M 20,60 Q 150,40 270,40 Q 320,45 380,65 Q 270,55 20,70 Z', red:'M 60,70 Q 180,55 280,60 Q 180,70 60,70 Z' },
  'womens-cute':    { label:'可愛い',   path:'M 20,65 L 20,45 Q 200,45 380,52 L 380,58 Q 200,60 20,65 Z', red:'M 30,68 Q 200,63 350,60 Q 200,70 30,68 Z' }
};
const SCENES = {
  mens:   ['mens-business','mens-sexy','mens-clean','mens-strong'],
  womens: ['womens-business','womens-sexy','womens-natural','womens-cute']
};
const SCENE_NAMES = {
  'mens-business':'ビジネス眉（信頼・知性）','mens-sexy':'モテ眉（フェロモン・色気）',
  'mens-clean':'清潔眉（ナチュラル・爽やか）','mens-strong':'強さ眉（ワイルド・意思）',
  'womens-business':'ハンサム眉（自立・知性）','womens-sexy':'エレガント眉（フェロモン・華やか）',
  'womens-natural':'ふんわり眉（優しさ・親しみ）','womens-cute':'平行眉（ピュア・可愛らしさ）'
};
const LEFT_EYEBROW  = [46,53,52,65,55,70,63,105,66,107];
const RIGHT_EYEBROW = [276,283,282,295,285,300,293,334,296,336];

let currentGender = 'mens';
let currentScene  = 'mens-business';
let faceMesh = null;
let videoW = 640, videoH = 480;

function setGender(g, btn) {
  currentGender = g;
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentScene = SCENES[g][0];
  renderSceneButtons();
}

function renderSceneButtons() {
  const list = document.getElementById('scene-list');
  list.innerHTML = '';
  SCENES[currentGender].forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn' + (id === currentScene ? ' active' : '');
    btn.textContent = TEMPLATES[id].label;
    btn.onclick = () => {
      currentScene = id;
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    list.appendChild(btn);
  });
}

function drawEyebrowSVG(landmarks) {
  const svg = document.getElementById('svg-overlay');
  svg.innerHTML = '';
  const tmpl = TEMPLATES[currentScene];
  if (!tmpl) return;
  [
    { indices: LEFT_EYEBROW,  flip: false },
    { indices: RIGHT_EYEBROW, flip: true  }
  ].forEach(({ indices, flip }) => {
    const pts = indices.map(i => landmarks[i]);
    const xs = pts.map(p => p.x * videoW);
    const ys = pts.map(p => p.y * videoH);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const bW = maxX - minX;
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2 - bW * 0.15;
    const sx = bW / 360;
    const sy = sx * 3;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    if (flip) {
      g.setAttribute('transform', `translate(${cx + 200*sx},${cy - 50*sy}) scale(${-sx},${sy})`);
    } else {
      g.setAttribute('transform', `translate(${cx - 200*sx},${cy - 50*sy}) scale(${sx},${sy})`);
    }
    const bp = document.createElementNS('http://www.w3.org/2000/svg','path');
    bp.setAttribute('d', tmpl.path);
    bp.setAttribute('fill','#0055FF');
    bp.setAttribute('fill-opacity','0.6');
    bp.setAttribute('stroke','#66aaff');
    bp.setAttribute('stroke-width','1');
    g.appendChild(bp);
    const rp = document.createElementNS('http://www.w3.org/2000/svg','path');
    rp.setAttribute('d', tmpl.red);
    rp.setAttribute('fill','#FF3333');
    rp.setAttribute('fill-opacity','0.7');
    g.appendChild(rp);
    svg.appendChild(g);
  });
}

async function startScan() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('capture-canvas');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0);
  ctx.restore();
  const imageBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
  document.getElementById('result-photo').src = canvas.toDataURL('image/jpeg', 0.8);
  document.getElementById('analyzing').classList.add('show');

  try {
    // ★ Vercelのサーバー経由でGeminiを呼ぶ（APIキーを隠す）
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64,
        scene: SCENE_NAMES[currentScene]
      })
    });

    const result = await response.json();
    document.getElementById('result-scene-badge').textContent = SCENE_NAMES[currentScene];
    document.getElementById('r-trim').textContent   = result.trim;
    document.getElementById('r-keep').textContent   = result.keep;
    document.getElementById('r-advice').textContent = result.advice;
    document.getElementById('analyzing').classList.remove('show');
    document.getElementById('result-panel').classList.add('show');

  } catch(e) {
    document.getElementById('analyzing').classList.remove('show');
    alert('診断に失敗しました。');
    console.error(e);
  }
}

function closeResult() {
  document.getElementById('result-panel').classList.remove('show');
}

async function initFaceMesh() {
  faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });
  faceMesh.setOptions({
    maxNumFaces: 1, refineLandmarks: true,
    minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  });
  faceMesh.onResults(results => {
    const status  = document.getElementById('status');
    const scanBtn = document.getElementById('scan-btn');
    if (results.multiFaceLandmarks?.length > 0) {
      status.textContent = '● DETECTING';
      status.className = 'detecting';
      scanBtn.disabled = false;
      drawEyebrowSVG(results.multiFaceLandmarks[0]);
    } else {
      status.textContent = '● SEARCHING';
      status.className = 'searching';
      scanBtn.disabled = true;
      document.getElementById('svg-overlay').innerHTML = '';
    }
  });
}

async function startCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    videoW = video.videoWidth  || 640;
    videoH = video.videoHeight || 480;
    const svg = document.getElementById('svg-overlay');
    svg.setAttribute('viewBox', `0 0 ${videoW} ${videoH}`);
    const camera = new Camera(video, {
      onFrame: async () => { if (faceMesh) await faceMesh.send({ image: video }); }
    });
    camera.start();
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading-sub').textContent = 'カメラの許可をしてください';
  }
}

window.addEventListener('load', async () => {
  renderSceneButtons();
  await initFaceMesh();
  await startCamera();
});
</script>
</body>
</html>
